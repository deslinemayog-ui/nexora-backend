[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "node_modules/**,src/firebase.ts,web/src/firebase.ts,dist/**,web/dist/**"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,FIREBASE_API_KEY"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
